spring:
  application:
    name: processo-judicial-api

  datasource:
    url: jdbc:postgresql://localhost:5432/processo_judicial
    username: attus
    password: attus123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

  endpoint:
    health:
      show-details: always

logging:
  level:
    com.attus: DEBUG
    org.springframework.web: INFO

resilience4j:
  circuitbreaker:
    instances:
      viacep:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true

  retry:
    instances:
      viacep:
        max-attempts: 3
        wait-duration: 500ms
<h6 class="fw-bold">Nova Movimentação</h6>
<form [formGroup]="form" (ngSubmit)="submeter()">
  <div class="mb-2">
    <textarea class="form-control form-control-sm" formControlName="descricao"
      rows="3" placeholder="Descreva a movimentação..."
      [class.is-invalid]="invalido('descricao')">
    </textarea>
    <div class="invalid-feedback">Descrição é obrigatória</div>
  </div>
  <button type="submit" class="btn btn-primary btn-sm w-100">
    <i class="fas fa-plus me-1"></i>Registrar Movimentação
  </button>
</form>

<div class="d-flex align-items-center mb-4">
  <a routerLink="/processos" class="btn btn-outline-secondary me-3">
    <i class="fas fa-arrow-left"></i>
  </a>
  <h2 class="mb-0">
    <i class="fas fa-file-alt me-2 text-primary"></i>
    Detalhes do Processo
  </h2>
</div>

<div *ngIf="processo">
  <div class="card mb-4">
    <div class="card-body">
      <div class="row">
        <div class="col-md-8">
          <h4 class="fw-bold">{{ processo.numero }}</h4>
          <p class="text-muted mb-1">{{ processo.assunto }}</p>
          <p class="text-muted mb-0">
            <i class="fas fa-gavel me-1"></i>{{ processo.vara }}
          </p>
        </div>
        <div class="col-md-4 text-md-end">
          <app-status-badge [status]="processo.status" />
          <div class="mt-2">
            <a [routerLink]="['/processos', processo.id, 'editar']" class="btn btn-outline-primary btn-sm">
              <i class="fas fa-edit me-1"></i>Editar
            </a>
          </div>
        </div>
      </div>

      <hr/>

      <div class="row g-3">
        <div class="col-md-3">
          <small class="text-muted d-block">Data de Abertura</small>
          <strong>{{ processo.dataAbertura | date:'dd/MM/yyyy' }}</strong>
        </div>
        <div class="col-md-3">
          <small class="text-muted d-block">Criado em</small>
          <strong>{{ processo.criadoEm | date:'dd/MM/yyyy HH:mm' }}</strong>
        </div>
        <div class="col-md-6">
          <small class="text-muted d-block mb-1">Alterar Status</small>
          <div class="btn-group">
            <button *ngFor="let s of statusOptions" class="btn btn-sm"
              [ngClass]="s === processo.status ? 'btn-primary' : 'btn-outline-primary'"
              (click)="atualizarStatus(s)">
              {{ s }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header bg-white fw-bold">
          <i class="fas fa-users me-2 text-primary"></i>Partes Envolvidas
        </div>
        <div class="card-body">
          <div *ngIf="processo.partes.length === 0" class="text-muted text-center py-3">
            Nenhuma parte cadastrada
          </div>
          <app-parte-card *ngFor="let parte of processo.partes" [parte]="parte" />
          <hr/>
          <app-parte-form (parteAdicionada)="onParteAdicionada($event)" />
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header bg-white fw-bold">
          <i class="fas fa-history me-2 text-primary"></i>Movimentações
        </div>
        <div class="card-body">
          <app-movimentacao-timeline [movimentacoes]="processo.movimentacoes" />
          <hr/>
          <app-movimentacao-form (movimentacaoAdicionada)="onMovimentacaoAdicionada($event)" />
        </div>
      </div>
    </div>
  </div>
</div>
